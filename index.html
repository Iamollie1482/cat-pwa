  html += '<span class="cnt-dot" style="background:var(--tel);flex-shrink:0;width:7px;height:7px;margin-top:4px"></span>';
  html += '<div style="flex:1;min-width:0">';
  // 飲水標題列
  html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:' + (wLogs.length > 0 ? '6px' : '8px') + '">';
  html += '<span style="font-size:13px;font-weight:500;color:var(--t1)">飲水 <span class="sec-note" style="font-size:11px">全貓共用</span></span>';
  html += '<span style="font-size:14px;font-weight:700;color:var(--tel)">' + (wTotal > 0 ? wTotal + ' ml' : '—') + '</span>';
  html += '</div>';
  // 已記錄的換水 — 單行格式
  for (var wli = 0; wli < wLogs.length; wli++) {
    html += '<div style="display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:4px">';
    html += '<span style="color:var(--t3);flex-shrink:0;font-weight:500">第'+(wli+1)+'次</span>';
    html += '<span style="color:var(--t2);flex:1;white-space:nowrap">加'+wLogs[wli].added+'−剩'+wLogs[wli].left+' = <b style="color:var(--tel)">'+wLogs[wli].drunk+' ml</b></span>';
    html += '<button class="btn-del wlog-del" data-wi="'+wli+'" style="width:18px;height:18px;font-size:10px;flex-shrink:0">✕</button>';
    html += '</div>';
  }
  // 新增換水輸入
  var wDef = D.waterDefault || 320;
  html += '<div style="display:flex;gap:5px;align-items:center;margin-top:' + (wLogs.length > 0 ? '6px' : '0') + '">';
  html += '<input class="inp-sm" type="number" id="w-added" placeholder="加水" min="0" value="' + wDef + '" style="width:76px;font-size:12px;padding:6px 8px">';
  html += '<input class="inp-sm" type="number" id="w-left" placeholder="剩餘" min="0" style="width:76px;font-size:12px;padding:6px 8px">';
  html += '<span class="sub" id="w-calc" style="flex:1;font-size:11px;white-space:nowrap"></span>';
  html += '<button class="btn" id="btn-add-water" style="background:var(--tel);padding:6px 12px;font-size:12px;flex-shrink:0">記錄</button>';
  html += '</div>';
  html += '</div>';
  html += '</div>'; // end rec-row
  html += '</div>'; // end card

  // 熱量摘要（日曆頁只顯示摘要，不含新增功能）
  var daily = calcDaily(catObj());
  var ate = calcAte(selDate);
  var pct = Math.min(ate/daily*100, 100);
  var over = ate > daily;
  var meals = getMeals(selDate);

  html += '<div class="sec">今日熱量 — ' + catN() + '</div>';
  html += '<div class="card2">';
  html += '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:2px">';
  html += '<span class="big">' + ate + '</span><span style="font-size:14px;color:var(--t2)">/ ' + daily + ' kcal</span>';
  html += '<span class="tag ' + (over?'tag-r':pct>85?'tag-a':'tag-g') + '">' + (over?'超標':'正常') + '</span></div>';
  html += '<div class="prog-bar"><div class="prog-fill' + (over?' over':'') + '" style="width:' + pct + '%"></div></div>';
  html += '<div style="display:flex;justify-content:space-between"><span class="sub">已攝取 ' + ate + ' kcal</span>';
  html += '<span class="sub">' + (over?'超出':'剩餘') + ' ' + Math.abs(daily-ate).toFixed(1) + ' kcal</span></div>';
  if (meals.length > 0) {
    html += '<div style="margin-top:10px;border-top:1px solid var(--bd);padding-top:8px">';
    for (var mi = 0; mi < meals.length; mi++) {
      var mf = foodById(meals[mi].foodId);
      if (!mf) continue;
      html += '<div class="meal-row"><span style="font-size:12px;color:var(--t3);width:36px;flex-shrink:0">' + meals[mi].time + '</span>';
      html += '<div style="flex:1"><div style="font-size:13px;font-weight:500">' + mf.name + ' ×' + meals[mi].portions + '</div>';
      html += '<div class="sub">' + (mf.grams*meals[mi].portions).toFixed(0) + 'g</div></div>';
      html += '<span style="font-size:12px;color:var(--t2)">' + (mf.kcal*meals[mi].portions).toFixed(1) + ' kcal</span>';
      html += '<button class="btn-del day-meal-del" data-mid="' + meals[mi].id + '">✕</button></div>';
    }
    html += '</div>';
  } else {
    html += '<div style="margin-top:6px;font-size:12px;color:var(--t3)">前往「🍽️ 熱量」分頁新增用餐</div>';
  }
  html += '</div>';

  // 護理
  html += '<div class="sec">護理紀錄 — ' + catN() + '</div>';
  html += '<div class="care-list">';
  for (var ci = 0; ci < CARE_ITEMS.length; ci++) {
    var item = CARE_ITEMS[ci];
    var last = lastCareDate(item.key);
    var ago = last ? Math.floor((new Date() - new Date(last)) / 86400000) : null;
    var badge = ago===null ? '<span class="tag tag-x">未記錄</span>'
      : ago >= item.days ? '<span class="tag tag-a">該做了</span>'
      : '<span class="tag tag-g">' + ago + '天前</span>';
    html += '<div class="care-row" data-care="' + item.key + '">';
    html += '<div class="care-ico" style="background:' + item.bg + '">' + item.ico + '</div>';
    html += '<div style="flex:1"><div style="font-size:13px;font-weight:500">' + item.name + '</div>';
    // 疫苗顯示種類
    if (item.key === 'vaccine' && last) {
      var vtype = getLastVaccineTypeForDate(last);
      html += '<div style="font-size:11px;color:var(--t3)">' + last + (vtype ? ' · ' + vtype : '') + '</div>';
    } else {
      html += '<div style="font-size:11px;color:var(--t3)">' + (last||'點擊記錄') + '</div>';
    }
    html += '</div>' + badge + '</div>';
  }
  // 嘔吐（獨立計次，不需要日期）
  html += '<div class="care-row" style="cursor:default">';
  html += '<div class="care-ico" style="background:#FDEAEA">🤢</div>';
  html += '<div style="flex:1"><div style="font-size:13px;font-weight:500">嘔吐次數</div>';
  html += '<div style="font-size:11px;color:var(--t3)">' + catN() + ' 專屬</div></div>';
  html += '<div style="display:flex;align-items:center;gap:6px">';
  html += '<button class="rec-btn" data-t="vomit" data-d="-1">−</button>';
  html += '<span style="font-size:17px;font-weight:700;min-width:24px;text-align:center" id="vom-v">' + (r.vomit||0) + '</span>';
  html += '<button class="rec-btn" data-t="vomit" data-d="1">+</button>';
  html += '</div></div>';
  html += '</div>';

  // 體重
  html += '<div class="sec">體重 — ' + catN() + '</div>';
  html += '<div class="card"><div class="row">';
  html += '<input class="inp-sm" type="number" id="w-inp" step="0.01" min="0" max="20" placeholder="kg" value="' + (r.weight||'') + '" style="width:90px">';
  html += '<span class="lbl">公斤</span><button class="btn" style="margin-left:auto" id="btn-save-weight">儲存</button></div>';
  if (recentW.length > 1) {
    html += '<div style="margin-top:8px">';
    for (var wi = 0; wi < recentW.length; wi++) {
      html += '<div class="wh-row"><span style="color:var(--t3)">' + recentW[wi].dt + '</span><span style="font-weight:600">' + recentW[wi].w + ' kg</span></div>';
    }
    html += '</div>';
  }
  html += '</div>';

  // 餵藥
  if (meds.length > 0) {
    html += '<div class="sec">餵藥紀錄 — ' + catN() + '</div>';
    for (var medi = 0; medi < meds.length; medi++) {
      var given = r.meds && r.meds[meds[medi]];
      html += '<div class="card" style="display:flex;align-items:center;gap:9px;padding:11px 13px;margin-bottom:8px;' + (given?'background:var(--rose-p);border-color:var(--rose-l)':'') + '">';
      html += '<div class="med-chk" data-medi="' + medi + '" style="width:24px;height:24px;border-radius:7px;border:1.5px solid ' + (given?'var(--rose)':'var(--cr3)') + ';background:' + (given?'var(--rose)':'var(--cr2)') + ';display:flex;align-items:center;justify-content:center;cursor:pointer;color:' + (given?'#fff':'transparent') + ';font-size:13px;flex-shrink:0">✓</div>';
      html += '<span style="flex:1;font-size:13px;font-weight:500">' + meds[medi] + '</span></div>';
    }
  }

  // 備註
  html += '<div class="sec">備註 — ' + catN() + '</div>';
  html += '<textarea class="textarea" id="notes-inp" placeholder="記錄顏色、形狀、異常狀況...">' + (r.notes||'') + '</textarea>';
  html += '<button class="btn" id="save-day-btn" style="width:100%;margin:12px 0 22px;padding:13px;font-size:15px">儲存紀錄</button>';

  dp.innerHTML = html;

  // Bind events
  document.getElementById('btn-save-weight').onclick = saveWeight;
  document.getElementById('save-day-btn').onclick = saveDay;

  var cntBtns = dp.querySelectorAll('.rec-btn');
  for (var bi = 0; bi < cntBtns.length; bi++) {
    cntBtns[bi].onclick = (function(t, d) {
      return function() {
        if (t === 'vomit') { chVomit(d); }
        else { chShared(t, d); }
      };
    })(cntBtns[bi].getAttribute('data-t'), parseInt(cntBtns[bi].getAttribute('data-d')));
  }

  // water inline events
  var addWaterBtn = document.getElementById('btn-add-water');
  if (addWaterBtn) addWaterBtn.onclick = addWaterLog;
  var addedEl = document.getElementById('w-added');
  var leftEl = document.getElementById('w-left');
  function calcPreview() {
    var a = parseFloat(addedEl ? addedEl.value : 0) || 0;
    var l = parseFloat(leftEl ? leftEl.value : 0) || 0;
    var calc = document.getElementById('w-calc');
    if (calc) calc.textContent = a > 0 ? '= ' + Math.max(0, a-l) + ' ml' : '';
  }
  if (addedEl) addedEl.addEventListener('input', calcPreview);
  if (leftEl) leftEl.addEventListener('input', calcPreview);
  var wlogDels = dp.querySelectorAll('.wlog-del');
  for (var wdi = 0; wdi < wlogDels.length; wdi++) {
    wlogDels[wdi].addEventListener('click', (function(wi) {
      return function() { delWaterLog(wi); };
    })(parseInt(wlogDels[wdi].getAttribute('data-wi'))));
  }

  var careRows = dp.querySelectorAll('.care-row');
  for (var cri = 0; cri < careRows.length; cri++) {
    careRows[cri].addEventListener('click', (function(key) {
      return function() { openCareModal(key); };
    })(careRows[cri].getAttribute('data-care')));
  }

  var medChks = dp.querySelectorAll('.med-chk');
  for (var mci = 0; mci < medChks.length; mci++) {
    medChks[mci].addEventListener('click', (function(idx) {
      return function() { toggleMed(idx); };
    })(parseInt(medChks[mci].getAttribute('data-medi'))));
  }

  // 日曆頁用餐刪除
  var dayMealDels = dp.querySelectorAll('.day-meal-del');
  for (var dmd = 0; dmd < dayMealDels.length; dmd++) {
    dayMealDels[dmd].addEventListener('click', (function(mid) {
      return function() {
        var k = catN() + '|' + selDate;
        D.meals[k] = (D.meals[k]||[]).filter(function(m) { return m.id !== mid; });
        saveD(); renderCal_light(); buildDayPanel();
      };
    })(parseInt(dayMealDels[dmd].getAttribute('data-mid'))));
  }

  buildWaterCard();
}

// ===== WATER CARD =====
function buildWaterCard() {
  var wc = document.getElementById('water-card');
  if (!wc) return;
  var s = getShared(selDate);
  var logs = s.waterLogs || [];
  var total = 0;
  for (var i = 0; i < logs.length; i++) total += logs[i].drunk || 0;

  var html = '';
  if (logs.length > 0) {
    html += '<div style="font-size:20px;font-weight:700;color:var(--tel);margin-bottom:8px">' + total + ' <span style="font-size:13px;font-weight:400;color:var(--t3)">ml 今日總飲水</span></div>';
    for (var i2 = 0; i2 < logs.length; i2++) {
      html += '<div style="margin-bottom:6px">';
      html += '<div style="display:flex;align-items:center;gap:6px;font-size:13px">';
      html += '<span style="color:var(--t3);width:32px;flex-shrink:0;font-weight:500">第' + (i2+1) + '次</span>';
      html += '<span style="font-weight:600;color:var(--tel)">' + logs[i2].drunk + ' ml</span>';
      html += '<button class="btn-del wlog-del" data-wi="' + i2 + '" style="margin-left:auto">✕</button></div>';
      html += '<div style="margin-left:38px;font-size:11px;color:var(--t3)">加 ' + logs[i2].added + 'ml − 剩 ' + logs[i2].left + 'ml</div>';
      html += '</div>';
    }
    html += '<div style="height:4px"></div>';
  } else {
    html += '<div class="empty" style="padding:10px 0">尚未記錄今日飲水</div>';
  }

  var wDef2 = D.waterDefault || 320;
  html += '<div style="margin-top:10px;background:var(--cr2);border-radius:11px;padding:12px">';
  html += '<div style="font-size:11px;color:var(--t3);margin-bottom:8px;font-weight:600">新增換水紀錄</div>';
  html += '<div style="display:flex;gap:6px;align-items:center;margin-bottom:8px">';
  html += '<span style="font-size:12px;color:var(--t2);width:52px;flex-shrink:0">加水量</span>';
  html += '<input class="inp-sm" type="number" id="w-added" value="' + wDef2 + '" min="0" style="width:80px">';
  html += '<span style="font-size:12px;color:var(--t3)">ml</span></div>';
  html += '<div style="display:flex;gap:6px;align-items:center;margin-bottom:10px">';
  html += '<span style="font-size:12px;color:var(--t2);width:52px;flex-shrink:0">剩餘量</span>';
  html += '<input class="inp-sm" type="number" id="w-left" placeholder="ml" min="0" style="width:80px">';
  html += '<span style="font-size:12px;color:var(--t3)">ml</span></div>';
  html += '<div style="display:flex;align-items:center;gap:8px">';
  html += '<span class="sub" id="w-calc" style="flex:1"></span>';
  html += '<button class="btn" id="btn-add-water" style="background:var(--tel)">記錄</button></div></div>';

  wc.innerHTML = html;

  var delBtns = wc.querySelectorAll('.wlog-del');
  for (var di = 0; di < delBtns.length; di++) {
    delBtns[di].addEventListener('click', (function(wi) {
      return function() { delWaterLog(wi); };
    })(parseInt(delBtns[di].getAttribute('data-wi'))));
  }

  document.getElementById('btn-add-water').onclick = addWaterLog;

  var addedEl = document.getElementById('w-added');
  var leftEl = document.getElementById('w-left');
  function calcPreview() {
    var a = parseFloat(addedEl.value) || 0;
    var l = parseFloat(leftEl.value) || 0;
    var calc = document.getElementById('w-calc');
    if (calc) calc.textContent = a > 0 ? '飲水量 = ' + Math.max(0, a-l) + ' ml' : '';
  }
  addedEl.addEventListener('input', calcPreview);
  leftEl.addEventListener('input', calcPreview);
}

function addWaterLog() {
  var added = parseFloat(document.getElementById('w-added').value) || 0;
  var left = parseFloat(document.getElementById('w-left').value) || 0;
  if (!added) { alert('請輸入加水量'); return; }
  var drunk = Math.max(0, added - left);
  var s = getShared(selDate);
  s.waterLogs.push({added:added, left:left, drunk:drunk});
  saveD(); renderCal_light(); buildWaterCard();
}

function delWaterLog(i) {
  var s = getShared(selDate);
  s.waterLogs.splice(i, 1);
  saveD(); renderCal_light(); buildWaterCard();
}

// light re-render (just dots, no full rebuild)
function renderCal_light() {
  var cells = document.querySelectorAll('#cal-grid .cell');
  for (var i = 0; i < cells.length; i++) {
    var ds = cells[i].getAttribute('data-ds');
    var dots = getDots(ds);
    var dotsHtml = '';
    for (var di = 0; di < Math.min(dots.length, 5); di++) {
      dotsHtml += '<span class="cdot" style="background:' + DOT_COLOR[dots[di]] + '"></span>';
    }
    var dd = cells[i].querySelector('.cdots');
    if (dd) dd.innerHTML = dotsHtml;
  }
}

function chShared(type, delta) {
  var s = getShared(selDate);
  s[type] = Math.max(0, (s[type]||0) + delta);
  var ids = {pee:'pee-v', poop:'poo-v', vomitUnknown:'vomit-unknown-v'};
  var el = document.getElementById(ids[type]);
  if (el) el.textContent = s[type];
  saveD(); renderCal_light();
}

function chVomit(delta) {
  var r = getRec(selDate);
  r.vomit = Math.max(0, (r.vomit||0) + delta);
  var el = document.getElementById('vom-v');
  if (el) el.textContent = r.vomit;
  saveD(); renderCal_light();
}

function saveWeight() {
  var r = getRec(selDate);
  var v = parseFloat(document.getElementById('w-inp').value);
  r.weight = isNaN(v) ? '' : v;
  saveD(); renderCal_light(); buildDayPanel();
}

function toggleMed(i) {
  var r = getRec(selDate);
  if (!r.meds) r.meds = {};
  var m = getCatMeds()[i];
  r.meds[m] = !r.meds[m];
  saveD(); buildDayPanel();
}

function saveDay() {
  var r = getRec(selDate);
  r.notes = document.getElementById('notes-inp').value;
  var v = parseFloat(document.getElementById('w-inp').value);
  r.weight = isNaN(v) ? '' : v;
  saveD(); renderCal_light();
  var b = document.getElementById('save-day-btn');
  b.textContent = '✓ 已儲存！'; b.style.background = 'var(--grn)';
  setTimeout(function() { b.textContent = '儲存紀錄'; b.style.background = ''; }, 1600);
}

// ===== CARE MODAL =====
function openCareModal(key) {
  curCareKey = key;
  var item = null;
  for (var i = 0; i < CARE_ITEMS.length; i++) if (CARE_ITEMS[i].key===key) { item=CARE_ITEMS[i]; break; }
  document.getElementById('mcare-title').textContent = item.name;

  // 顯示所有歷史紀錄（可刪除）
  var entries = Object.keys(D.records)
    .filter(function(k) { return k.indexOf(catN()+'|')===0 && D.records[k].care && D.records[k].care[key]; })
    .map(function(k) { return k.split('|')[1]; })
    .sort().reverse();

  var histEl = document.getElementById('mcare-history');
  if (entries.length > 0) {
    var histHtml = '<div style="font-size:12px;font-weight:600;color:var(--t3);margin-bottom:6px">已記錄</div>';
    entries.forEach(function(dt) {
      var vtype = (key==='vaccine') ? getLastVaccineTypeForDate(dt) : '';
      histHtml += '<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--bd)">';
      histHtml += '<span style="flex:1;font-size:13px">' + dt + (vtype?' · '+vtype:'') + '</span>';
      histHtml += '<button class="btn-del care-del-btn" data-dt="'+dt+'" style="width:24px;height:24px;font-size:12px">✕</button>';
      histHtml += '</div>';
    });
    histEl.innerHTML = histHtml;
    histEl.style.marginBottom = '12px';
    // 綁定刪除按鈕
    var delBtns = histEl.querySelectorAll('.care-del-btn');
    for (var i = 0; i < delBtns.length; i++) {
      delBtns[i].addEventListener('click', (function(dt) {
        return function() {
          var r = D.records[catN()+'|'+dt];
          if (r && r.care) {
            delete r.care[key];
            if (key==='vaccine') delete r.care.vaccineType;
          }
          saveD(); renderCal_light();
          openCareModal(key); // 重新開啟更新清單
        };
      })(delBtns[i].getAttribute('data-dt')));
    }
  } else {
    histEl.innerHTML = '';
    histEl.style.marginBottom = '0';
  }

  // 新增日期預設今天
  document.getElementById('mcare-date').value = todayStr;
  var isVaccine = key === 'vaccine';
  document.getElementById('mcare-vaccine-row').style.display = isVaccine ? '' : 'none';
  if (isVaccine) {
    document.getElementById('mcare-vaccine-type').value = '';
  }
  openModal('modal-care');
}

function getLastVaccineType() {
  var entries = Object.keys(D.records)
    .filter(function(k) { return k.indexOf(catN()+'|')===0 && D.records[k].care && D.records[k].care.vaccine; })
    .sort().reverse();
  for (var i = 0; i < entries.length; i++) {
    var vt = D.records[entries[i]].care.vaccineType;
    if (vt) return vt;
  }
  return '';
}

function getLastVaccineTypeForDate(date) {
  var k = catN() + '|' + date;
  var r = D.records[k];
  return (r && r.care && r.care.vaccineType) ? r.care.vaccineType : '';
}

function confirmCare() {
  var dt = document.getElementById('mcare-date').value;
  if (!dt) return;
  var r = getRec(dt);
  if (!r.care) r.care = {};
  r.care[curCareKey] = true;
  if (curCareKey === 'vaccine') {
    var vtype = document.getElementById('mcare-vaccine-type').value.trim();
    r.care.vaccineType = vtype || '';
  }
  saveD(); closeModal('modal-care'); renderCal_light(); buildDayPanel();
}

// ===== CALORIE PAGE =====
function buildCaloriePage() {
  if (!currentRoom) { showPage('cal'); return; }
  var pg = document.getElementById('pg-calorie');
  var presets = getCatPresets();

  // 月曆（簡版，同日曆頁）
  var first = new Date(viewY, viewM, 1).getDay();
  var dim = new Date(viewY, viewM+1, 0).getDate();
  var prev = new Date(viewY, viewM, 0).getDate();
  var cells = '';
  function mkCal2(d, ds, other) {
    var isTod = ds===todayStr, isSel = ds===selDate;
    var cls = 'cell' + (other?' other':'') + (isSel?' sel':isTod?' tod':'');
    var dots = getDots(ds);
    var dotsHtml = '';
    for (var di = 0; di < Math.min(dots.length,5); di++) dotsHtml += '<span class="cdot" style="background:'+DOT_COLOR[dots[di]]+'"></span>';
    return '<div class="' + cls + '" data-ds2="' + ds + '"><span class="cnum">' + d + '</span><div class="cdots">' + dotsHtml + '</div></div>';
  }
  for (var i = 0; i < first; i++) { var d2=prev-first+1+i; cells+=mkCal2(d2,fmtDate(new Date(viewY,viewM-1,d2)),true); }
  for (var d3=1;d3<=dim;d3++) cells+=mkCal2(d3,fmtDate(new Date(viewY,viewM,d3)),false);
  var rem=(first+dim)%7===0?0:7-(first+dim)%7;
  for (var i2=1;i2<=rem;i2++) { cells+=mkCal2(i2,fmtDate(new Date(viewY,viewM+1,i2)),true); }
  var dayLabels2=['日','一','二','三','四','五','六'];
  var hdr2='';
  for(var li=0;li<7;li++) hdr2+='<div class="cal-dl" style="'+(li===0?'color:var(--rose)':li===6?'color:var(--lav)':'')+'">' + dayLabels2[li]+'</div>';

  var daily = calcDaily(catObj()), ate = calcAte(selDate);
  var pct = Math.min(ate/daily*100, 100), over = ate > daily;
  var meals = getMeals(selDate);
  var d4 = new Date(selDate+'T00:00:00');
  var wk2=['日','一','二','三','四','五','六'];
  var dateLbl = (d4.getMonth()+1)+'月'+d4.getDate()+'日（'+wk2[d4.getDay()]+'）';

  var html = '';
  // 月曆導航
  html += '<div class="mnav" style="margin-top:4px">';
  html += '<button class="mnav-btn" id="cal2-prev">‹</button>';
  html += '<span style="font-size:15px;font-weight:600">' + viewY + ' 年 ' + MN[viewM] + '</span>';
  html += '<button class="mnav-btn" id="cal2-next">›</button></div>';
  html += '<div class="cal-wrap"><div class="cal-hdr">' + hdr2 + '</div>';
  html += '<div class="cal-grid" id="cal-grid2">' + cells + '</div></div>';

  // 選取日期的熱量
  html += '<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px">';
  html += '<span style="font-size:16px;font-weight:700">' + dateLbl + '</span>';
  if (selDate===todayStr) html += '<span class="sub">今天</span>';
  html += '</div>';
  html += '<div class="card2" style="margin-bottom:10px">';
  html += '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:2px">';
  html += '<span class="big">' + ate + '</span><span style="font-size:14px;color:var(--t2)">/ ' + daily + ' kcal</span>';
  html += '<span class="tag '+(over?'tag-r':pct>85?'tag-a':'tag-g')+'">'+(over?'超標':pct===0?'未開始':'正常')+'</span></div>';
  html += '<div class="prog-bar"><div class="prog-fill'+(over?' over':'')+'" style="width:'+pct+'%"></div></div>';
  html += '<div style="display:flex;justify-content:space-between"><span class="sub">已攝取 '+ate+' kcal</span>';
  html += '<span class="sub">'+(over?'超出':'剩餘')+' '+Math.abs(daily-ate).toFixed(1)+' kcal</span></div>';
  if (meals.length > 0) {
    html += '<div style="margin-top:10px;border-top:1px solid var(--bd);padding-top:8px">';
    for (var mi2 = 0; mi2 < meals.length; mi2++) {
      var mf2 = foodById(meals[mi2].foodId); if (!mf2) continue;
      html += '<div class="meal-row"><span style="font-size:12px;color:var(--t3);width:36px;flex-shrink:0">'+meals[mi2].time+'</span>';
      html += '<div style="flex:1"><div style="font-size:13px;font-weight:500">'+mf2.name+' ×'+meals[mi2].portions+'</div>';
      html += '<div class="sub">'+(mf2.grams*meals[mi2].portions).toFixed(0)+'g</div></div>';
      html += '<span style="font-size:12px;color:var(--t2)">'+(mf2.kcal*meals[mi2].portions).toFixed(1)+' kcal</span>';
      html += '<button class="btn-del cal2-meal-del" data-mid="'+meals[mi2].id+'">✕</button></div>';
    }
    html += '</div>';
  }
  html += '</div>';

  // 手動新增（先出現）
  html += '<div class="sec">新增用餐</div><div class="card">';
  html += '<div class="row"><span class="lbl">時間</span><input class="inp-sm" type="time" id="m-time" value="'+nowTime()+'" step="60" style="width:105px"></div>';
  html += '<div class="row"><span class="lbl">食物</span><select class="sel" id="m-food">';
  for (var fi2 = 0; fi2 < D.foods.length; fi2++) html += '<option value="'+D.foods[fi2].id+'">'+D.foods[fi2].name+'</option>';
  html += '</select></div>';
  html += '<div class="row"><span class="lbl">份數</span><input class="inp-sm" type="number" id="m-portions" value="1" min="0.5" step="0.5" style="width:70px"><span class="sub" id="m-hint" style="flex:1;text-align:right"></span></div>';
  html += '<div style="display:flex;align-items:center;gap:8px;margin-top:4px"><span class="sub" id="m-prev" style="flex:1"></span>';
  html += '<button class="btn btn-g" id="btn-save-preset" style="font-size:12px;padding:7px 10px">存為常用</button>';
  html += '<button class="btn btn-g" id="btn-add-meal-both" style="font-size:12px;padding:7px 10px" title="同時新增到兩隻貓">同步新增</button>';
  html += '<button class="btn" id="btn-add-meal">新增</button></div></div>';

  // 常用餐點（在手動新增下方）
  if (presets.length > 0) {
    html += '<div class="sec">常用餐點<span class="sec-note">點擊直接新增到 '+dateLbl+'</span></div>';
    for (var pi = 0; pi < presets.length; pi++) {
      var pr2 = presets[pi]; var pf2 = foodById(pr2.foodId); if (!pf2) continue;
      html += '<div style="display:flex;align-items:center;gap:8px;background:var(--cr);border:1px solid var(--bd);border-radius:var(--r);padding:9px 13px;margin-bottom:6px">';
      html += '<div style="flex:1"><div style="font-size:13px;font-weight:500">'+pr2.time+' · '+pf2.name+' ×'+pr2.portions+'</div>';
      html += '<div class="sub">'+(pf2.grams*pr2.portions).toFixed(0)+'g · '+(pf2.kcal*pr2.portions).toFixed(1)+' kcal</div></div>';
      html += '<button class="btn-del preset-del2" data-pi="'+pi+'" style="margin-right:4px" title="刪除常用">✕</button>';
      html += '<button class="btn btn-g cal2-preset-add-both" data-pi="'+pi+'" style="padding:6px 10px;font-size:12px">同步</button>';
      html += '<button class="btn cal2-preset-add" data-pi="'+pi+'" style="padding:7px 12px;font-size:13px">＋新增</button>';
      html += '</div>';
    }
  }

  html += '<div style="height:16px"></div>';
  pg.innerHTML = html;

  // 月曆點擊
  var cellEls2 = document.getElementById('cal-grid2').querySelectorAll('.cell');
  for (var ci2=0;ci2<cellEls2.length;ci2++) {
    cellEls2[ci2].addEventListener('click',(function(ds){
      return function(){selDate=ds;buildCaloriePage();document.getElementById('scroll').scrollTop=290;};
    })(cellEls2[ci2].getAttribute('data-ds2')));
  }
  document.getElementById('cal2-prev').onclick=function(){changeMonth(-1);buildCaloriePage();};
  document.getElementById('cal2-next').onclick=function(){changeMonth(1);buildCaloriePage();};

  // 刪除當日用餐
  var cal2dels=pg.querySelectorAll('.cal2-meal-del');
  for(var cd=0;cd<cal2dels.length;cd++){
    cal2dels[cd].onclick=(function(mid){
      return function(){
        var k=catN()+'|'+selDate;
        D.meals[k]=(D.meals[k]||[]).filter(function(m){return m.id!==mid;});
        saveD();renderCal_light();buildCaloriePage();
      };
    })(parseInt(cal2dels[cd].getAttribute('data-mid')));
  }

  // 常用餐點新增（單貓）— 用 onclick 避免重複綁定
  var cal2adds=pg.querySelectorAll('.cal2-preset-add');
  for(var pa=0;pa<cal2adds.length;pa++){
    cal2adds[pa].onclick=(function(pi2){
      return function(){
        var pr=getCatPresets()[pi2]; if(!pr)return;
        var k=catN()+'|'+selDate;
        if(!D.meals[k])D.meals[k]=[];
        D.meals[k].push({id:D.nextId++,foodId:pr.foodId,portions:pr.portions,time:pr.time});
        D.meals[k].sort(function(a,b){return a.time>b.time?1:-1;});
        saveD();renderCal_light();buildCaloriePage();
      };
    })(parseInt(cal2adds[pa].getAttribute('data-pi')));
  }
  // 常用餐點同步新增（所有貓）— 用 onclick 避免重複綁定
  var cal2addsAll=pg.querySelectorAll('.cal2-preset-add-both');
  for(var pab=0;pab<cal2addsAll.length;pab++){
    cal2addsAll[pab].onclick=(function(pi5){
      return function(){
        var pr=getCatPresets()[pi5]; if(!pr)return;
        D.cats.forEach(function(cat){
          var k=cat.name+'|'+selDate;
          if(!D.meals[k])D.meals[k]=[];
          D.meals[k].push({id:D.nextId++,foodId:pr.foodId,portions:pr.portions,time:pr.time});
          D.meals[k].sort(function(a,b){return a.time>b.time?1:-1;});
        });
        saveD();renderCal_light();buildCaloriePage();
      };
    })(parseInt(cal2addsAll[pab].getAttribute('data-pi')));
  }

  // 刪除常用
  var pdels=pg.querySelectorAll('.preset-del2');
  for(var pd=0;pd<pdels.length;pd++){
    pdels[pd].onclick=(function(pi3){
      return function(){
        if(!confirm('刪除此常用餐點？'))return;
        getCatPresets().splice(pi3,1);saveD();buildCaloriePage();
      };
    })(parseInt(pdels[pd].getAttribute('data-pi')));
  }

  // 手動新增
  function updatePrev() {
    var fid=parseInt(document.getElementById('m-food').value);
    var portions=parseFloat(document.getElementById('m-portions').value)||1;
    var f=foodById(fid); if(!f)return;
    document.getElementById('m-hint').textContent='每份 '+f.grams+'g';
    document.getElementById('m-prev').textContent='→ '+(f.grams*portions).toFixed(0)+'g，'+(f.kcal*portions).toFixed(1)+' kcal';
  }
  document.getElementById('m-food').onchange=updatePrev;
  document.getElementById('m-portions').oninput=updatePrev;
  document.getElementById('btn-add-meal').onclick=function(){
    var fid=parseInt(document.getElementById('m-food').value);
    var portions=parseFloat(document.getElementById('m-portions').value)||1;
    var time=document.getElementById('m-time').value||nowTime();
    var k=catN()+'|'+selDate;
    if(!D.meals[k])D.meals[k]=[];
    D.meals[k].push({id:D.nextId++,foodId:fid,portions:portions,time:time});
    D.meals[k].sort(function(a,b){return a.time>b.time?1:-1;});
    saveD();renderCal_light();buildCaloriePage();
  };
  // 同步新增：新增到所有貓
  document.getElementById('btn-add-meal-both').onclick=function(){
    var fid=parseInt(document.getElementById('m-food').value);
    var portions=parseFloat(document.getElementById('m-portions').value)||1;
    var time=document.getElementById('m-time').value||nowTime();
    D.cats.forEach(function(cat){
      var k=cat.name+'|'+selDate;
      if(!D.meals[k])D.meals[k]=[];
      D.meals[k].push({id:D.nextId++,foodId:fid,portions:portions,time:time});
      D.meals[k].sort(function(a,b){return a.time>b.time?1:-1;});
    });
    saveD();renderCal_light();buildCaloriePage();
  };
  document.getElementById('btn-save-preset').onclick=function(){
    var fid=parseInt(document.getElementById('m-food').value);
    var portions=parseFloat(document.getElementById('m-portions').value)||1;
    var time=document.getElementById('m-time').value||nowTime();
    var presets2=getCatPresets();
    var dup=false;
    for(var pi4=0;pi4<presets2.length;pi4++){if(presets2[pi4].foodId===fid&&presets2[pi4].time===time){dup=true;break;}}
    if(dup){alert('此時間點的食物已在常用餐點中');return;}
    presets2.push({foodId:fid,portions:portions,time:time});
    presets2.sort(function(a,b){return a.time>b.time?1:-1;});
    saveD();
    var btn=document.getElementById('btn-save-preset');
    btn.textContent='✓ 已儲存';btn.style.background='var(--grn)';
    setTimeout(function(){btn.textContent='存為常用';btn.style.background='';},1500);
    buildCaloriePage();
  };
  updatePrev();
}

// ===== FOODS PAGE =====
function buildFoodsPage() {
  if (!currentRoom) { showPage('cal'); return; }
  var html = '<div class="sec" style="margin-top:4px">食物庫（所有貓共用）</div><div class="card">';
  if (D.foods.length > 0) {
    for (var i = 0; i < D.foods.length; i++) {
      html += '<div class="food-row"><div style="flex:1"><div style="font-size:13px;font-weight:500">' + D.foods[i].name + '</div>';
      html += '<div class="sub">每份 ' + D.foods[i].grams + 'g · ' + D.foods[i].kcal + ' kcal/份</div></div>';
      html += '<button class="btn-del food-del" data-fid="' + D.foods[i].id + '">✕</button></div>';
    }
  } else { html += '<div class="empty">尚無食物</div>'; }
  html += '</div>';

  html += '<div class="sec">新增食物</div><div class="card">';
  html += '<div class="row"><span class="lbl" style="width:52px">名稱</span><input class="inp" id="f-name" placeholder="例：O30 主食罐"></div>';
  html += '<div class="row"><span class="lbl" style="width:52px">每份</span><input class="inp-sm" type="number" id="f-grams" placeholder="克" min="1" style="width:65px"><span class="lbl">克</span>';
  html += '<input class="inp-sm" type="number" id="f-kcal" placeholder="大卡" min="0" style="width:75px;margin-left:4px"><span class="lbl">kcal/份</span></div>';
  html += '<div style="background:var(--cr2);border-radius:10px;padding:10px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:8px">';
  html += '<span class="sub">或填每 100g 熱量：</span><input class="inp-sm" type="number" id="f-per100" placeholder="kcal" style="width:90px">';
  html += '<button class="btn btn-g" id="btn-calc100" style="padding:7px 12px">換算</button></div>';
  html += '<div style="display:flex;justify-content:flex-end"><button class="btn" id="btn-add-food">新增食物</button></div></div>';

  document.getElementById('pg-foods').innerHTML = html;

  document.getElementById('btn-calc100').onclick = function() {
    var g = parseFloat(document.getElementById('f-grams').value) || 0;
    var p = parseFloat(document.getElementById('f-per100').value) || 0;
    if (g && p) document.getElementById('f-kcal').value = Math.round(g*p/100*10)/10;
  };
  document.getElementById('btn-add-food').onclick = function() {
    var name = document.getElementById('f-name').value.trim();
    var grams = parseFloat(document.getElementById('f-grams').value) || 0;
    var kcal = parseFloat(document.getElementById('f-kcal').value) || 0;
    if (!name||!grams||!kcal) { alert('請填寫名稱、每份克數和每份熱量'); return; }
    D.foods.push({id:D.nextId++, name:name, grams:grams, kcal:kcal});
    saveD(); buildFoodsPage();
  };
  var delBtns = document.querySelectorAll('.food-del');
  for (var di = 0; di < delBtns.length; di++) {
    delBtns[di].addEventListener('click', (function(fid) {
      return function() {
        D.foods = D.foods.filter(function(f) { return f.id !== fid; });
        saveD(); buildFoodsPage();
      };
    })(parseInt(delBtns[di].getAttribute('data-fid'))));
  }
}

// ===== SETTINGS PAGE =====
function buildSettingsPage() {
  var c = catObj(), meds = getCatMeds();
  var w = parseFloat(c.weight) || 0;
  var s = parseFloat(c.status) || 1.2;
  var rv = Math.round(calcRer(w)*10)/10;
  var daily = Math.round(rv*s*10)/10;

  var statuses = [
    ['2.5','幼貓（4個月以下）×2.5'],
    ['2.0','幼貓（4～12個月）×2.0'],
    ['1.4','成貓（未結紮）×1.4'],
    ['1.2','成貓（已結紮，體重正常）×1.2'],
    ['1.1','熟齡/高齡貓（活動量低）×1.1'],
    ['0.8','需要減肥的貓 ×0.8'],
    ['1.4b','偏瘦需增重 ×1.4']
  ];

  var room = getRoomCode();
  var url = getGSUrl();
  var syncLabel = room ? '🏠 房間：' + room + (url?' + 📊':'') : '🏠 未加入房間';
  var syncColor = room ? 'var(--grn)' : 'var(--t3)';
  var html = '<div class="sec" style="margin-top:4px">雲端同步</div>';
  html += '<div class="card" style="display:flex;align-items:center;gap:10px;cursor:pointer" id="btn-open-fb">';
  html += '<div style="flex:1"><div style="font-size:13px;font-weight:500;color:' + syncColor + '">' + syncLabel + '</div>';
  html += '<div class="sub">與家人共用同一個房間碼即可即時同步</div></div>';
  html += '<span style="font-size:18px">›</span></div>';
  html += '<div class="sec">貓咪資訊 — ' + catN() + '</div><div class="card">';
  // 計算年齡
  var ageStr = '';
  if (c.birthday) {
    var bd = new Date(c.birthday + 'T00:00:00');
    var now = new Date();
    var ageMs = now - bd;
    var ageYears = Math.floor(ageMs / (365.25*24*3600*1000));
    var ageMonths = Math.floor((ageMs % (365.25*24*3600*1000)) / (30.44*24*3600*1000));
    ageStr = ageYears > 0 ? ageYears + ' 歲 ' + ageMonths + ' 個月' : ageMonths + ' 個月';
  }
  html += '<div class="row"><span class="lbl" style="width:52px">名稱</span><input class="inp" id="s-name" value="' + (c.name||'') + '"></div>';
  html += '<div class="row"><span class="lbl" style="width:52px">生日</span><input class="inp-sm" type="date" id="s-birthday" value="' + (c.birthday||'') + '" style="width:145px">';
  if (ageStr) html += '<span style="font-size:13px;color:var(--rose);font-weight:600;margin-left:6px">🎂 ' + ageStr + '</span>';
  html += '</div>';
  html += '<div class="row"><span class="lbl" style="width:52px">體重</span><input class="inp-sm" type="number" id="s-weight" value="' + (c.weight||'') + '" min="0.1" step="0.1" style="width:80px"><span class="lbl">公斤</span></div>';
  html += '<div class="row"><span class="lbl" style="width:52px">狀態</span><select class="sel" id="s-status">';
  for (var si = 0; si < statuses.length; si++) {
    html += '<option value="' + statuses[si][0] + '"' + (c.status===statuses[si][0]?' selected':'') + '>' + statuses[si][1] + '</option>';
  }
  html += '</select></div>';
  html += '<div style="display:flex;justify-content:flex-end;margin-top:6px"><button class="btn" id="btn-save-cat">儲存設定</button></div></div>';

  html += '<div class="card2" id="rer-card">';
  if (w) {
    html += '<div class="g2"><div class="s-card"><div style="font-size:11px;color:var(--t3);margin-bottom:3px">RER 基礎代謝</div><div style="font-size:22px;font-weight:700">' + rv + '</div><div class="sub">kcal/天</div></div>';
    html += '<div class="s-card"><div style="font-size:11px;color:var(--t3);margin-bottom:3px">每日熱量目標</div><div style="font-size:22px;font-weight:700">' + daily + '</div><div class="sub">kcal/天</div></div></div>';
    html += '<div class="sub" style="margin-top:10px">RER = 30 × ' + w + ' + 70 = ' + rv + '，× ' + s + ' = ' + daily + ' kcal</div>';
  }
  html += '</div>';

  html += '<div class="sec">飲水預設值</div>';
  html += '<div class="card"><div class="row">';
  html += '<span class="lbl">加水預設量</span>';
  html += '<input class="inp-sm" type="number" id="s-water-default" value="' + (D.waterDefault||320) + '" min="0" style="width:80px">';
  html += '<span class="lbl">ml</span>';
  html += '<button class="btn" style="margin-left:auto" id="btn-save-water-default">儲存</button>';
  html += '</div></div>';

  html += '<div class="sec">藥物管理</div><div class="card">';
  if (meds.length > 0) {
    for (var mi = 0; mi < meds.length; mi++) {
      html += '<div class="food-row"><span style="flex:1;font-size:13px;font-weight:500">' + meds[mi] + '</span>';
      html += '<button class="btn-del med-del" data-mi="' + mi + '">✕</button></div>';
    }
  } else { html += '<div class="empty">尚無藥物</div>'; }
  html += '</div>';
  html += '<div class="card" style="display:flex;gap:8px;align-items:center">';
  html += '<input class="inp" id="med-inp" placeholder="新增藥物名稱" style="flex:1;margin:0" maxlength="20">';
  html += '<button class="btn" id="btn-add-med">新增</button></div>';

  html += '<div class="sec">危險區域</div>';
  html += '<div class="card" style="border-color:var(--red-l)">';
  html += '<div style="font-size:13px;color:var(--t2);margin-bottom:12px">遇到 BUG 或想重新開始，可以清除資料。</div>';
  html += '<button id="btn-reset-data" style="width:100%;padding:11px;border-radius:10px;border:1.5px solid var(--red-l);background:var(--red-l);color:var(--red);font-size:13px;font-weight:600;cursor:pointer;margin-bottom:8px">🗑️ 清除所有紀錄（保留設定和食物庫）</button>';
  html += '<button id="btn-reset-all" style="width:100%;padding:11px;border-radius:10px;border:1.5px solid var(--red);background:transparent;color:var(--red);font-size:13px;font-weight:600;cursor:pointer">⚠️ 清除全部資料（完全重置）</button>';
  html += '</div>';
  html += '<div style="height:16px"></div>';

  document.getElementById('pg-settings').innerHTML = html;

  function updateRer() {
    var wv = parseFloat(document.getElementById('s-weight').value) || 0;
    var sv = parseFloat(document.getElementById('s-status').value) || 1.2;
    var rc = Math.round(calcRer(wv)*10)/10;
    var dc = Math.round(rc*sv*10)/10;
    var card = document.getElementById('rer-card');
    if (!card) return;
    if (wv) {
      card.innerHTML = '<div class="g2"><div class="s-card"><div style="font-size:11px;color:var(--t3);margin-bottom:3px">RER 基礎代謝</div><div style="font-size:22px;font-weight:700">' + rc + '</div><div class="sub">kcal/天</div></div><div class="s-card"><div style="font-size:11px;color:var(--t3);margin-bottom:3px">每日熱量目標</div><div style="font-size:22px;font-weight:700">' + dc + '</div><div class="sub">kcal/天</div></div></div><div class="sub" style="margin-top:10px">RER = 30 × ' + wv + ' + 70 = ' + rc + '，× ' + sv + ' = ' + dc + ' kcal</div>';
    } else { card.innerHTML = ''; }
  }

  document.getElementById('btn-open-fb').onclick = openFBModal;
  document.getElementById('btn-save-water-default').onclick = function() {
    var v = parseFloat(document.getElementById('s-water-default').value);
    if (!isNaN(v) && v >= 0) {
      D.waterDefault = v;
      saveD();
      var btn = document.getElementById('btn-save-water-default');
      btn.textContent = '✓ 已儲存'; btn.style.background = 'var(--grn)';
      setTimeout(function(){ btn.textContent = '儲存'; btn.style.background = ''; }, 1500);
    }
  };
  document.getElementById('s-weight').addEventListener('input', updateRer);
  document.getElementById('s-status').addEventListener('change', updateRer);
  document.getElementById('btn-save-cat').onclick = function() {
    c.name = document.getElementById('s-name').value.trim() || c.name;
    c.birthday = document.getElementById('s-birthday').value || '';
    c.weight = parseFloat(document.getElementById('s-weight').value) || c.weight;
    c.status = document.getElementById('s-status').value;
    saveD(); renderCatBar(); buildSettingsPage();
  };
  document.getElementById('btn-add-med').onclick = function() {
    var v = document.getElementById('med-inp').value.trim();
    if (!v) return;
    var m = getCatMeds();
    if (m.indexOf(v) === -1) { m.push(v); saveD(); }
    document.getElementById('med-inp').value = '';
    buildSettingsPage();
  };
  document.getElementById('med-inp').addEventListener('keydown', function(e) {
    if (e.key==='Enter') document.getElementById('btn-add-med').click();
  });
  var delBtns = document.querySelectorAll('.med-del');
  for (var di = 0; di < delBtns.length; di++) {
    delBtns[di].addEventListener('click', (function(mi) {
      return function() { getCatMeds().splice(mi,1); saveD(); buildSettingsPage(); };
    })(parseInt(delBtns[di].getAttribute('data-mi'))));
  }

  document.getElementById('btn-reset-data').onclick = function() {
    if (!confirm('確定要清除所有紀錄嗎？\n（貓咪設定、食物庫會保留，只清除日記錄）')) return;
    D.records = {};
    D.shared = {};
    D.meals = {};
    D.nextId = 10;
    saveD();
    alert('已清除所有紀錄！');
    showPage('cal');
  };
  document.getElementById('btn-reset-all').onclick = function() {
    if (!confirm('⚠️ 確定要清除全部資料（包含貓咪設定、食物庫）？\n此動作無法復原！')) return;
    if (!confirm('再次確認：真的要清除所有資料嗎？')) return;
    localStorage.removeItem(SK);
    localStorage.removeItem(GS_SK);
    location.reload();
  };
}

// ===== REPORT PAGE =====
function buildReportPage() {
  if (!currentRoom) { showPage('cal'); return; }
  var pg = document.getElementById('pg-report');
  var DAYS = 30;
  var dates = [];
  for (var i = DAYS-1; i >= 0; i--) {
    var d = new Date(); d.setDate(d.getDate() - i);
    dates.push(fmtDate(d));
  }

  function catReport(cname) {
    var weights = [], waters = [], kcals = [], vomits = [];
    for (var i = 0; i < dates.length; i++) {
      var dt = dates[i];
      var rk = cname + '|' + dt;
      var r = D.records[rk];
      var s = D.shared[dt];
      var meals = D.meals[rk] || [];
      var ate = 0;
      for (var mi = 0; mi < meals.length; mi++) {
        var f = foodById(meals[mi].foodId);
        if (f) ate += f.kcal * meals[mi].portions;
      }
      var wTotal = 0;
      if (s && s.waterLogs) for (var wi = 0; wi < s.waterLogs.length; wi++) wTotal += s.waterLogs[wi].drunk||0;
      weights.push(r && r.weight ? parseFloat(r.weight) : null);
      waters.push(wTotal > 0 ? wTotal : null);
      kcals.push(ate > 0 ? Math.round(ate*10)/10 : null);
      vomits.push(r && r.vomit > 0 ? r.vomit : 0);
    }
    return {weights:weights, waters:waters, kcals:kcals, vomits:vomits};
  }

  // 多條折線圖（體重、嘔吐共用）
  function multiLineChart(series, unit) {
    var allVals = [];
    series.forEach(function(s) {
      s.vals.forEach(function(v) { if (v !== null && v > 0) allVals.push(v); });
    });
    if (allVals.length === 0) return '<div class="empty" style="padding:8px 0;font-size:12px">無資料</div>';

    var max = Math.max.apply(null, allVals);
    var min = unit === 'kg' ? Math.min.apply(null, allVals) : 0;
    var range = max - min || 0.5;
    var W = 280, H = 100, padT = 10, padB = 18, padL = 30, padR = 8;
    var chartW = W - padL - padR, chartH = H - padT - padB;
    var nDates = dates.length;

    var svg = '<svg width="100%" viewBox="0 0 ' + W + ' ' + H + '" style="display:block">';
    // 格線
    svg += '<line x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+(H-padB)+'" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>';
    svg += '<line x1="'+padL+'" y1="'+(H-padB)+'" x2="'+(W-padR)+'" y2="'+(H-padB)+'" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>';
    svg += '<line x1="'+padL+'" y1="'+(padT+chartH/2)+'" x2="'+(W-padR)+'" y2="'+(padT+chartH/2)+'" stroke="rgba(0,0,0,0.04)" stroke-width="1" stroke-dasharray="3,2"/>';
    // Y軸標籤
    svg += '<text x="'+(padL-4)+'" y="'+(padT+4)+'" font-size="8" fill="rgba(0,0,0,0.4)" text-anchor="end">'+max.toFixed(unit==='kg'?1:0)+'</text>';
    svg += '<text x="'+(padL-4)+'" y="'+(H-padB)+'" font-size="8" fill="rgba(0,0,0,0.4)" text-anchor="end">'+min.toFixed(unit==='kg'?1:0)+'</text>';
    // X軸日期（首、中、末）
    [0, Math.floor(nDates/2), nDates-1].forEach(function(idx) {
      var xp = padL + Math.round(idx * chartW / (nDates-1));
      svg += '<text x="'+xp+'" y="'+(H-padB+10)+'" font-size="8" fill="rgba(0,0,0,0.35)" text-anchor="middle">'+(dates[idx]?dates[idx].slice(5):'')+'</text>';
    });
    // 每條線
    series.forEach(function(s) {
      var points = [];
      for (var i = 0; i < s.vals.length; i++) {
        var v = s.vals[i];
        if (v === null || (unit !== 'kg' && v === 0)) continue;
        var xp = padL + Math.round(i * chartW / (nDates-1));
        var yp = padT + Math.round((1-(v-min)/range) * chartH);
        points.push({x:xp, y:yp, v:v});
      }
      if (points.length === 0) return;
      if (points.length === 1) {
        svg += '<circle cx="'+points[0].x+'" cy="'+points[0].y+'" r="3" fill="'+s.color+'"/>';
        return;
      }
      svg += '<polyline points="'+points.map(function(p){return p.x+','+p.y;}).join(' ')+'" fill="none" stroke="'+s.color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
      points.forEach(function(p) {
        svg += '<circle cx="'+p.x+'" cy="'+p.y+'" r="2.5" fill="'+s.color+'"/>';
      });
    });
    svg += '</svg>';

    // 統計列
    var statsHtml = '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:4px">';
    series.forEach(function(s) {
      var nonNull = s.vals.filter(function(v){ return v !== null && v > 0; });
      if (nonNull.length === 0) return;
      var latest = nonNull[nonNull.length-1];
      var avg = nonNull.reduce(function(a,b){return a+b;},0)/nonNull.length;
      statsHtml += '<span style="font-size:11px;color:var(--t2);display:flex;align-items:center;gap:4px">';
      statsHtml += '<span style="display:inline-block;width:14px;height:2.5px;background:'+s.color+';border-radius:2px"></span>';
      statsHtml += s.name+': 最新 '+latest.toFixed(unit==='kg'?2:0)+unit;
      if (unit==='kg') statsHtml += ' / 平均 '+avg.toFixed(2)+unit;
      statsHtml += '</span>';
    });
    statsHtml += '</div>';
    return svg + statsHtml;
  }

  // 長條圖（飲水）
  function sparkline(vals, color, unit) {
    var nonNull = vals.filter(function(v){return v!==null && v>0;});
    if (nonNull.length === 0) return '<div class="empty" style="padding:8px 0;font-size:12px">無資料</div>';
    var max = Math.max.apply(null, nonNull);
    var W = 280, H = 55, pad = 4;
    var bw = Math.max(2, Math.floor(W / vals.length) - 1);
    var svg = '<svg width="100%" viewBox="0 0 '+W+' '+H+'" style="display:block">';
    svg += '<line x1="0" y1="'+(H-pad)+'" x2="'+W+'" y2="'+(H-pad)+'" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>';
    for (var i = 0; i < vals.length; i++) {
      if (!vals[i] || vals[i] <= 0) continue;
      var bh = Math.max(3, Math.round((vals[i]/max) * (H-pad*2)));
      var x = Math.round(i * W / vals.length);
      svg += '<rect x="'+x+'" y="'+(H-pad-bh)+'" width="'+bw+'" height="'+bh+'" rx="2" fill="'+color+'" opacity="0.8"/>';
    }
    svg += '</svg>';
    var avg = nonNull.reduce(function(a,b){return a+b;},0)/nonNull.length;
    return svg+'<div style="display:flex;justify-content:space-between;margin-top:4px"><span class="sub">平均 '+avg.toFixed(0)+' '+unit+'</span><span class="sub">最新 '+nonNull[nonNull.length-1]+' '+unit+'</span></div>';
  }

  // 收集資料
  var allReps = D.cats.map(function(cat) {
    return {cat:cat, rep:catReport(cat.name), color:catColorByName(cat.name)};
  });
  var sharedVomits = dates.map(function(dt) {
    var s = D.shared[dt]; return (s && s.vomitUnknown > 0) ? s.vomitUnknown : 0;
  });
  var sharedWaters = dates.map(function(dt) {
    var s = D.shared[dt];
    if (!s || !s.waterLogs) return null;
    var t = s.waterLogs.reduce(function(a,l){return a+(l.drunk||0);},0);
    return t > 0 ? t : null;
  });

  // 圖例
  var legendHtml = '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;padding:8px 0">';
  allReps.forEach(function(cr) {
    legendHtml += '<div style="display:flex;align-items:center;gap:5px"><span style="width:20px;height:3px;background:'+cr.color+';border-radius:2px;display:inline-block"></span><span style="font-size:12px;color:var(--t2);font-weight:500">'+cr.cat.name+'</span></div>';
  });
  legendHtml += '<div style="display:flex;align-items:center;gap:5px"><span style="width:20px;height:3px;background:var(--red);border-radius:2px;display:inline-block"></span><span style="font-size:12px;color:var(--t2);font-weight:500">不明嘔吐</span></div>';
  legendHtml += '</div>';

  var html = '<div class="sec" style="margin-top:4px">近30天報表</div>';
  html += legendHtml;

  // 體重折線圖
  html += '<div class="card2" style="margin-bottom:10px">';
  html += '<div style="font-size:13px;font-weight:600;margin-bottom:8px">⚖️ 體重趨勢（kg）</div>';
  html += multiLineChart(allReps.map(function(cr){ return {vals:cr.rep.weights, color:cr.color, name:cr.cat.name}; }), 'kg');
  html += '</div>';

  // 嘔吐折線圖（各貓 + 共用不明）
  var vomitSeries = allReps.map(function(cr){ return {vals:cr.rep.vomits, color:cr.color, name:cr.cat.name}; });
  vomitSeries.push({vals:sharedVomits, color:'var(--red)', name:'不明'});
  var hasAnyVomit = vomitSeries.some(function(s){ return s.vals.some(function(v){return v>0;}); });
  html += '<div class="card2" style="margin-bottom:10px">';
  html += '<div style="font-size:13px;font-weight:600;margin-bottom:8px">🤢 嘔吐紀錄（次）</div>';
  html += hasAnyVomit ? multiLineChart(vomitSeries, '次') : '<div class="empty" style="padding:8px 0;font-size:12px">近30天無嘔吐紀錄 ✓</div>';
  html += '</div>';

  // 飲水長條圖
  html += '<div class="card2" style="margin-bottom:10px">';
  html += '<div style="font-size:13px;font-weight:600;margin-bottom:8px">💧 每日飲水（ml）<span class="sec-note">全貓共用</span></div>';
  html += sparkline(sharedWaters, 'var(--tel)', 'ml');
  html += '</div>';

  // 熱量折線圖
  html += '<div class="card2" style="margin-bottom:10px">';
  html += '<div style="font-size:13px;font-weight:600;margin-bottom:8px">🍽️ 每日熱量（kcal）</div>';
  html += multiLineChart(allReps.map(function(cr){ return {vals:cr.rep.kcals, color:cr.color, name:cr.cat.name}; }), 'kcal');
  html += '</div>';

  // 體重明細（所有貓）
  var hasWEntries = false;
  var wTableHtml = '<div class="card">';
  allReps.forEach(function(cr) {
    var entries = Object.keys(D.records)
      .filter(function(k){ return k.indexOf(cr.cat.name+'|')===0 && D.records[k].weight; })
      .map(function(k){ return {dt:k.split('|')[1], w:parseFloat(D.records[k].weight)}; })
      .sort(function(a,b){ return b.dt>a.dt?1:-1; })
      .slice(0,6);
    if (entries.length === 0) return;
    hasWEntries = true;
    wTableHtml += '<div style="font-size:12px;font-weight:600;color:'+cr.color+';padding:6px 0 4px;border-bottom:1px solid var(--bd)">'+cr.cat.name+'</div>';
    entries.forEach(function(e, ei) {
      var diff = ei < entries.length-1 ? (e.w - entries[ei+1].w) : null;
      var ds = diff !== null ? ' <span style="color:'+(diff>0?'var(--red)':'var(--grn)')+';font-size:11px">('+(diff>0?'+':'')+diff.toFixed(2)+')</span>' : '';
      wTableHtml += '<div class="wh-row"><span style="color:var(--t3)">'+e.dt+'</span><span style="font-weight:600">'+e.w+' kg'+ds+'</span></div>';
    });
  });
  wTableHtml += '</div>';
  if (hasWEntries) {
    html += '<div class="sec">體重紀錄明細</div>' + wTableHtml;
  }

  // 疫苗記錄明細
  html += buildVaccineSection(allReps);

  html += '<div style="height:20px"></div>';
  pg.innerHTML = html;
}

function buildVaccineSection(allReps) {
  var html = '';
  var hasAny = false;
  allReps.forEach(function(cr) {
    var entries = Object.keys(D.records)
      .filter(function(k) {
        return k.indexOf(cr.cat.name+'|')===0 &&
          D.records[k].care && D.records[k].care.vaccine;
      })
      .map(function(k) {
        return {
          dt: k.split('|')[1],
          type: (D.records[k].care.vaccineType) || '（未填種類）'
        };
      })
      .sort(function(a,b){ return b.dt > a.dt ? 1 : -1; });
    if (entries.length === 0) return;
    hasAny = true;
    html += '<div style="font-size:12px;font-weight:600;color:' + cr.color + ';padding:6px 0 4px;border-bottom:1px solid var(--bd)">' + cr.cat.name + '</div>';
    entries.forEach(function(e) {
      html += '<div class="wh-row"><span style="color:var(--t3)">' + e.dt + '</span><span style="font-weight:500">💉 ' + e.type + '</span></div>';
    });
  });
  if (!hasAny) return '';
  return '<div class="sec">疫苗記錄明細</div><div class="card">' + html + '</div>';
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(function(){});

init();
</script>
